# Publish each Pulse release to plugins/pulse.
#
# Pulse serves the Codex plugin as a public zip with its sha256 in
# https://mcp.trypulse.tech/cli/bundles/index.json. scripts/sync.mjs downloads
# it, verifies the hash, checks every file against an allowlist and a
# deny-list, and refuses a version that is not newer than the published one.
# When a new version passes, this job commits "release: pulse X.Y.Z" and tags
# pulse/vX.Y.Z. When any check fails, nothing is committed or pushed.
name: sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check and stage the latest bundle
        id: sync
        run: node scripts/sync.mjs

      - name: Commit, tag and push
        if: steps.sync.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          set -euo pipefail
          tag="pulse/v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists; refusing to publish ${VERSION} twice"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- plugins/pulse
          git commit -m "release: pulse ${VERSION}"
          git tag -a "${tag}" -m "pulse ${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/${tag}"
          echo "Published ${tag}" >> "$GITHUB_STEP_SUMMARY"
