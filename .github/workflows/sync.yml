# Publish each Pulse release to plugins/pulse.
#
# Pulse serves the Codex plugin as a public zip with its sha256 in
# https://mcp.trypulse.tech/cli/bundles/index.json. scripts/sync.mjs downloads
# it, verifies the hash, checks every file against an allowlist and a
# deny-list, and refuses a version that is not newer than the published one.
# When a new version passes, this job commits "release: pulse X.Y.Z" and tags
# pulse/vX.Y.Z. When any check fails, nothing is committed or pushed.
name: sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check and stage the latest bundle
        id: sync
        run: node scripts/sync.mjs

      - name: Commit, tag and push
        if: steps.sync.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          set -euo pipefail
          tag="pulse/v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists; refusing to publish ${VERSION} twice"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- plugins/pulse
          git commit -m "release: pulse ${VERSION}"
          git tag -a "${tag}" -m "pulse ${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/${tag}"
          echo "Published ${tag}" >> "$GITHUB_STEP_SUMMARY"

      # Runs on every sync, not only when something was published: if creating
      # the release failed last time, the next run creates it for the tag that
      # is already there. A push made with GITHUB_TOKEN does not trigger other
      # workflows, so this cannot live in a separate on-tag workflow.
      - name: GitHub Release
        if: steps.sync.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync.outputs.version }}
          SHA256: ${{ steps.sync.outputs.sha256 }}
        run: |
          set -euo pipefail
          tag="pulse/v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is not published; no release to create"
            exit 0
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi
          notes="${RUNNER_TEMP}/notes.md"
          {
            echo "Pulse plugin for Codex, version ${VERSION}."
            echo
            echo '### Install'
            echo
            echo '```bash'
            echo 'codex plugin marketplace add try-pulse/pulse-plugins'
            echo 'codex plugin add pulse@pulse'
            echo 'codex mcp login pulse'
            echo '```'
            echo
            echo '### Update an existing install'
            echo
            echo '```bash'
            echo 'codex plugin marketplace upgrade pulse'
            echo '```'
            echo
            echo "Pin this release with \`--ref ${tag}\` on \`codex plugin marketplace add\`."
            echo
            echo '### Skills'
            echo
            for dir in plugins/pulse/skills/*/; do
              echo "- \`pulse:$(basename "${dir}")\`"
            done
            echo
            echo '### Provenance'
            echo
            echo "Published from https://mcp.trypulse.tech/cli/bundles/codex-plugin.zip after its checks passed."
            if [ -n "${SHA256}" ]; then
              echo "sha256 of the verified bundle: \`${SHA256}\`"
            fi
          } > "${notes}"
          gh release create "${tag}" --verify-tag --latest \
            --title "pulse ${VERSION}" --notes-file "${notes}"
          echo "Released ${tag}" >> "$GITHUB_STEP_SUMMARY"
